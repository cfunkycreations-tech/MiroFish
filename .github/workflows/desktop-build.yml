name: Build Windows desktop app

# Build the native Windows desktop app directly on GitHub's windows-latest:
#   * no cross-compiling; MSVC builds MiroFish.exe
#   * the artifact is the full offline package (bundled Python runtime + every dependency)
#
# Triggers:
#   * pushing a tag (v*) builds it and uploads it to the Release
#   * manual workflow_dispatch

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Bundled Python version (3.11 / 3.12 / 3.13)'
        default: '3.12'
        required: false
      create_release:
        description: 'Create/update the Release once the build finishes (manual trigger only)'
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.12' }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv ziglang pillow pytest

      - name: Fetch Windows wheels + embeddable Python
        run: python desktop/fetch_sources.py --build-dir build --skip-exe

      - name: Compile MiroFish.exe (MSVC)
        shell: cmd
        run: desktop\build_launcher.bat

      - name: Verify launcher
        run: python desktop/verify_exe.py build/MiroFish.exe

      - name: Run desktop tests
        run: python -m pytest desktop/tests -q

      - name: Package offline build
        shell: pwsh
        run: |
          $ver = "${{ inputs.python_version || '3.12' }}"
          $tag = $ver.Replace('.', '')
          python desktop/build.py --mode offline `
            --wheels "build/wheels-win$tag" `
            --embed "build/embed$tag" `
            --exe build/MiroFish.exe --out dist --zip

      - name: Package setup build
        run: python desktop/build.py --mode setup --exe build/MiroFish.exe --out dist --zip

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build the Windows installer
        env:
          NSISDIR: C:\Program Files (x86)\NSIS
        run: python desktop/build_installer.py --no-build --out dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiroFish-windows-x64-v${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/*setup.exe
          retention-days: 14

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content desktop/version.txt -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Attach to release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*setup.exe
          generate_release_notes: true

      - name: Create or update release (manual trigger)
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: MiroFish ${{ steps.ver.outputs.version }} · Windows x64
          files: |
            dist/*.zip
            dist/*setup.exe
          generate_release_notes: true

      - name: Publish release uploaded alongside a draft release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*.zip
            dist/*setup.exe
